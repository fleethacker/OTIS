common:
  domain: uds.dev
  host: parse-command
  clientId: parse-command
  clientSecretName: parse-command-oidc-client
  idpGatewayIp: ""
  idpNamespace: istio-tenant-gateway
  idpSelector: {app: tenant-ingressgateway}
  idpPort: 8443
  allowedGroups: [/Parse Command/Admin, /Parse Command/Viewer]
  storageClass: ""
  imapHost: ""
  imapPort: 993
image: "invalid.example/prepare-first:unbuilt"
config:
  ssoSecret: parse-command-sso
  stateIndex: .parse-command-state-v1
  requireStateMigration: false
  requireStationAssignment: false
  legacyStorage: false
  imapSecret: parse-command-imap
  adminGroup: /Parse Command/Admin
  viewerGroup: /Parse Command/Viewer
  custody: {size: 2Gi, existingClaim: ""}
  private: {size: 1Gi, existingClaim: ""}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 384Mi}
  # Complete bounded intake JSON supplied by deployment. No demo mailbox is created.
  intake: {}
