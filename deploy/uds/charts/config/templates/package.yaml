apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: parse-command
  namespace: {{ .Release.Namespace }}
spec:
  network:
    serviceMesh:
      mode: sidecar
    expose:
      - service: web
        selector: {app: parse-command-ui}
        host: {{ .Values.common.host | quote }}
        domain: {{ .Values.common.domain | quote }}
        port: 8080
    allow:
      - direction: Egress
        selector: {app: parse-command-ui}
        remoteSelector: {app: parse-command-server}
        remoteNamespace: {{ .Release.Namespace }}
        port: 8081
      - direction: Ingress
        selector: {app: parse-command-server}
        remoteSelector: {app: parse-command-ui}
        remoteNamespace: {{ .Release.Namespace }}
        port: 8081
      {{- range $app := list "parse-command-server" "parse-command-bootstrap" }}
      - direction: Egress
        selector: {app: {{ $app }}}
        remoteSelector: {app: parse-command-search}
        remoteNamespace: {{ $.Release.Namespace }}
        port: 9200
      - direction: Ingress
        selector: {app: parse-command-search}
        remoteSelector: {app: {{ $app }}}
        remoteNamespace: {{ $.Release.Namespace }}
        port: 9200
      {{- end }}
      - direction: Egress
        selector: {app: parse-command-server}
        remoteCidr: {{ required "common.imapCidr is required (mailbox-only egress)" .Values.common.imapCidr | quote }}
        port: {{ .Values.common.imapPort }}
      - direction: Egress
        selector: {app: parse-command-server}
        remoteNamespace: {{ .Values.common.idpGatewayNamespace | quote }}
        remoteSelector: {{ .Values.common.idpGatewaySelector | toJson }}
        port: {{ .Values.common.idpGatewayPort }}
  sso:
    - name: Parse Command
      clientId: {{ .Values.common.clientId | quote }}
      redirectUris:
        - {{ printf "https://%s.%s/auth/callback" .Values.common.host .Values.common.domain | quote }}
      publicClient: false
      standardFlowEnabled: true
      serviceAccountsEnabled: false
      attributes:
        pkce.code.challenge.method: S256
        use.refresh.tokens: "true"
      groups:
        anyOf: {{ list .Values.common.adminGroup .Values.common.viewerGroup | toJson }}
      protocolMappers:
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            claim.name: groups
---
# Search uses UDS mutual TLS and identity policy; it has no public ingress.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: parse-command-strict}
spec:
  mtls: {mode: STRICT}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: parse-command-search}
spec:
  selector:
    matchLabels: {app: parse-command-search}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/parse-command-server" .Release.Namespace | quote }}
              - {{ printf "cluster.local/ns/%s/sa/parse-command-bootstrap" .Release.Namespace | quote }}
      to:
        - operation: {ports: ["9200"]}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: {name: parse-command-server}
spec:
  selector:
    matchLabels: {app: parse-command-server}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/parse-command-ui" .Release.Namespace | quote }}
      to:
        - operation: {ports: ["8081"]}
