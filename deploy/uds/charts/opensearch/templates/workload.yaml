apiVersion: v1
kind: ServiceAccount
metadata: {name: parse-command-search}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: parse-command-bootstrap}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: opensearch}
spec:
  selector: {app: parse-command-search}
  ports: [{name: http-search, port: 9200, targetPort: 9200}]
---
{{- if not .Values.config.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parse-command-search
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.common.storageClass }}
  storageClassName: {{ .Values.common.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.config.storage.size }}}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: opensearch}
spec:
  replicas: 1
  serviceName: opensearch
  selector:
    matchLabels: {app: parse-command-search}
  template:
    metadata:
      labels: {app: parse-command-search}
    spec:
      serviceAccountName: parse-command-search
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: arm64, kubernetes.io/os: linux}
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: opensearch
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{containerPort: 9200}]
          env:
            - {name: discovery.type, value: single-node}
            # This is an explicit UDS-mesh security policy. See ADR 0002.
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: DJL_OFFLINE, value: "true"}
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: OPENBLAS_NUM_THREADS, value: "1"}
            - {name: MKL_NUM_THREADS, value: "1"}
            - {name: OPENSEARCH_JAVA_OPTS, value: {{ printf "%s -Dai.djl.offline=true -Dai.djl.onnxruntime.num_interop_threads=1 -Dai.djl.onnxruntime.num_intraop_threads=1 -Dai.djl.pytorch.num_interop_threads=1 -Dai.djl.pytorch.num_threads=1" .Values.config.jvm | quote }}}
          resources: {{ .Values.config.resources | toJson }}
          startupProbe:
            exec: {command: [bash, -ec, "curl --fail --max-time 3 -s http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow > /dev/null"]}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: {command: [bash, -ec, "curl --fail --max-time 3 -s http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow > /dev/null"]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9200}
            periodSeconds: 20
          volumeMounts:
            - {name: search, mountPath: /usr/share/opensearch/data}
      volumes:
        - name: search
          persistentVolumeClaim:
            claimName: {{ default "parse-command-search" .Values.config.storage.existingClaim }}
