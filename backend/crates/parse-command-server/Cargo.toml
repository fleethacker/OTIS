[package]
name = "parse-command-server"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
publish.workspace = true

[dependencies]
parse-command-state = { path = "../parse-command-state" }
parse-command-intake = { path = "../parse-command-intake" }
parse-command-types.workspace = true
parse-command-optask = { path = "../parse-command-optask" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
connectrpc = { version = "=0.9.1", default-features = false, features = ["server", "axum", "json"] }
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
axum = "=0.8.6"
tokio = { version = "=1.51.6", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokenizers = { version = "=0.20.3", default-features = false, features = ["onig"] }
unicode-general-category = "=1.1.0"
openidconnect = { version = "=4.1.0", default-features = false }
chacha20poly1305 = "=0.10.1"
base64 = "=0.22.1"
chrono-tz = "=0.10.4"

[build-dependencies]
connectrpc-build = "=0.9.0"
protoc-bin-vendored = "=3.2.0"

[lints]
workspace = true

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
