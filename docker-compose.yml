services:
  server:
    extends:
      file: ./backend/compose.intake.yaml
      service: server
    image: parse-command-server:local
    container_name: parse-command-server
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TOKENIZERS_PARALLELISM: "false"
      RAYON_NUM_THREADS: "1"
      PARSE_COMMAND_AUTH_MODE: local_demo
      PARSE_COMMAND_DEMO_AUTO_ROLE: "${ARK_MOCK_AUTH_AS:-user}"
      PARSE_COMMAND_OPENSEARCH_URL: http://opensearch:9200
      PARSE_COMMAND_STATE_INDEX: .parse-command-state-v1
      PARSE_COMMAND_CUSTODY_INDEX: .parse-command-custody-v1
      PARSE_COMMAND_PUBLIC_URL: "${PARSE_COMMAND_PUBLIC_URL:-http://127.0.0.1:8080}"
      PARSE_COMMAND_REQUIRE_STATE_MIGRATION: "${PARSE_COMMAND_REQUIRE_STATE_MIGRATION:-false}"
      PARSE_COMMAND_ALLOW_FIXTURES: "true"
    mem_limit: 256m
    pids_limit: 128
    volumes:
      - ./backend/config/demo-compose-intake.json:/etc/parse-command/config.json:ro
    networks: !override
      - demo-mail
      - application
    depends_on:
      opensearch:
        condition: service_healthy

  web:
    image: parse-command/watch-desk:local
    build:
      context: ./apps/watch-desk
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WATCH_DESK_PORT:-8080}:8080"
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    pids_limit: 32
    depends_on:
      server:
        condition: service_healthy

  opensearch:
    image: parse-command-opensearch:local
    build:
      context: ./backend/search
      dockerfile: opensearch/Dockerfile
    restart: unless-stopped
    environment:
      cluster.name: parse-command
      node.name: opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m -Dai.djl.offline=true -Dai.djl.onnxruntime.num_interop_threads=1 -Dai.djl.onnxruntime.num_intraop_threads=1 -Dai.djl.pytorch.num_interop_threads=1 -Dai.djl.pytorch.num_threads=1"
      # Native inference/tokenizer libraries are bundled in the pinned image.
      DJL_OFFLINE: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      # Local development only; the HTTP endpoint is bound to loopback.
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - application
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  custody:
    name: ${PARSE_COMMAND_CUSTODY_VOLUME:-parse-command_custody}
  private-state:
  watch-desk-data:
  opensearch-data:

networks:
  demo-mail:
    external: true
    name: parse-command-demo_mail
  application:
    # Ordinary bridge permits the loopback host ports above. Runtime assets are
    # bundled; enforce an operational enclave's egress policy at its boundary.
    driver: bridge
